# Keep routine tool results compact; request larger excerpts when diagnosing failures.
tool_output_token_limit = 6000

[mcp_servers.repowise]
command = "repowise"
# Repowise discovers the repository from the client's working directory.
args = ["mcp"]
startup_timeout_sec = 20

[features]
hooks = true

# Keep machine-specific skill overrides in user configuration.
# Project workflow guidance lives in AGENTS.md.
