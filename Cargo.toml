[workspace]
members = ["crates/acheflow-client", "crates/acheflow-composition", "crates/acheflow-server", "crates/acheflow-ui", "crates/acheflow-extension-api", "crates/acheflow-media-api", "crates/acheflow-control"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

