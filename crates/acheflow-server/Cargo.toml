[package]
name = "acheflow-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
acheflow-composition = { path = "../acheflow-composition", features=["headless"] }
acheflow-media-api = { path = "../acheflow-media-api" }
acheflow-control = { path = "../acheflow-control" }
acheflow-extension-api = { path = "../acheflow-extension-api", features=["schema"] }
rmcp = { version = "=3.8.0", features = ["transport-streamable-http-server", "schemars"] }
axum.workspace = true
axum-server = { version = "0.8", default-features = false, features = ["tls-openssl"] }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
openssl = "0.10"
tokio-openssl = "0.6"
serde_json = "1"
rml_rtmp = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
url = "2"
subtle = "=2.4.1"
tokio.workspace = true
tower-http.workspace = true

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "=3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
acheflow-client = { path = "../acheflow-client" }

[lints]
workspace = true

