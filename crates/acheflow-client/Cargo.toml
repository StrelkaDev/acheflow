[package]
name = "acheflow-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
serde_json = "1"

[dependencies]
acheflow-extension-api = { path = "../acheflow-extension-api" }
serde_json = "1"
serde.workspace = true
acheflow-control = { path = "../acheflow-control" }
url = "2"
base64 = "0.22"
sha2 = "0.9"
getrandom = { version = "0.2", features = ["js"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "native-tls"] }
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
webbrowser = "1"
futures-util = "0.3"
rmcp = { version = "=3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[lints]
workspace = true
